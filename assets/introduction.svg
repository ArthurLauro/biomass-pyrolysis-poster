  <rect x="225" y="285" width="310" height="120" rx="14" fill="#ffffff" stroke="#7bb99c"/>
  <text x="380" y="330" text-anchor="middle" font-size="24" font-family="Arial" fill="#155a4a" font-weight="700">Biochar Potential</text>
  <text x="380" y="360" text-anchor="middle" font-size="16" font-family="Arial" fill="#2a6d5f">Soil improvement + carbon storage</text>
